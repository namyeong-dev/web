<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden}</style></head>
<body>
<iframe id="f" style="border:0;display:block"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const W = +q.get('w') || 1440;
  const H = +q.get('h') || 900;
  const f = document.getElementById('f');
  f.style.width = W + 'px';
  f.style.height = H + 'px';
  f.src = '/?qa=1';
  f.onload = () => {
    const win = f.contentWindow;
    const doc = win.document;
    win.document.fonts.ready.then(() => setTimeout(() => {
      if (q.get('wrap')) {
        const wrap = doc.getElementById(q.get('wrap'));
        const p = parseFloat(q.get('p') || '0.7');
        const top = wrap.getBoundingClientRect().top + win.scrollY;
        const y = top + p * (wrap.offsetHeight - H);
        win.scrollTo({top: y, behavior: 'instant'});
      } else if (q.get('sel')) {
        const el = doc.querySelector(q.get('sel'));
        const top = el.getBoundingClientRect().top + win.scrollY;
        win.scrollTo({top: top + (+q.get('off') || 0), behavior: 'instant'});
      } else {
        win.scrollTo({top: +q.get('y') || 0, behavior: 'instant'});
      }
      win.dispatchEvent(new Event('scroll'));
    }, 250));
  };
</script>
</body>
</html>
